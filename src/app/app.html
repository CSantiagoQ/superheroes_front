<nav class="navbar">
  <div class="container">
    <div class="logo" routerLink="/">
      <span class="icon">🦸‍♂️</span>
      <strong>SuperHero App</strong>
    </div>

    <nav class="menu">
      <button routerLink="/catalog" routerLinkActive="active" class="menu-item">Catálogo</button>
      <button routerLink="/user-registration" routerLinkActive="active" class="menu-item">
        Alta de Usuarios
      </button>
      <button routerLink="/about" routerLinkActive="active" class="menu-item">
        Sobre el Proyecto
      </button>

      <!-- Theme toggle -->
      <button (click)="toggleDark()" class="btn-theme" title="Toggle dark mode">🌓</button>

      @if (!authService.currentUser()) {
        <button routerLink="/login" class="btn-login">Iniciar Sesión</button>
      } @else {
        <button routerLink="/add-hero" class="menu-item">➕ Nuevo Héroe</button>
        <button routerLink="/favoritos" routerLinkActive="active" class="menu-item">
          Mis Favoritos
        </button>
        <button routerLink="/carrito" routerLinkActive="active" class="menu-item">
          Carrito
        </button>
        <button routerLink="/pedidos" routerLinkActive="active" class="menu-item">
          Mis Pedidos
        </button>
        <button (click)="logout()" class="btn-logout">Cerrar Sesión</button>

        <!--         <div class="user-info">
          <span class="user-welcome">Hola, {{ authService.currentUser()?.nombre }}</span>
        </div> -->
      }
    </nav>
  </div>
</nav>
<main class="content-area">
  <router-outlet></router-outlet>
</main>
<footer class="main-footer">
  <p>&copy; 2026 Superhero Project - Desarrollado con Angular & Knex.js</p>
</footer>
@if (notify.message()) {
  <div class="comic-toast" [ngClass]="notify.type()">
    <div class="comic-content">
      {{ notify.message() }}
    </div>
  </div>
}

<style>
  .logo {
    background-color: var(--primary);
    color: var(--surface);
    text-align: center;
    font-size: 2rem;
  }

  .menu {
    background: transparent;
  }

      .menu-item {
    width: 15%;
    padding: 12px;
    margin: 5px;
    background: var(--accent);
    color: var(--text);
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
    &:hover {
      background: color-mix(in srgb, var(--accent) 80%, black 20%);
    }
    &:disabled {
      background: var(--muted);
    }
  }

  .btn-login,
  .btn-logout {
    width: 15%;
    float: right;
    padding: 12px;
    background: var(--primary);
    color: var(--surface);
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
    &:hover {
      background: color-mix(in srgb, var(--primary) 80%, black 20%);
    }
    &:disabled {
      background: var(--muted);
    }
  }

  .user-info {
    float: right;
  }

  .comic-toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 10000;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .comic-content {
    background: var(--surface);
    color: var(--text);
    border: 4px solid var(--text);
    padding: 15px 25px;
    font-weight: 900;
    text-transform: uppercase;
    font-family: 'Arial Black', sans-serif;
    position: relative;
    box-shadow: 8px 8px 0px var(--text);
  }
  /* Variaciones de color estilo cómic */
  .success .comic-content {
    background: var(--success);
    color: var(--surface);
  }
  .error .comic-content {
    background: var(--error);
    color: var(--surface);
  }
  .info .comic-content {
    background: var(--warning);
    color: var(--text);
  }
  @keyframes popIn {
    0% {
      transform: scale(0) rotate(-10deg);
      opacity: 0;
    }
    100% {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }
  }
  .main-footer {
    text-align: center;
    color: var(--surface);
    background-color: var(--primary);
    padding: 0.5rem;
  }

  .btn-theme {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 8px 10px;
    margin-left: 8px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
